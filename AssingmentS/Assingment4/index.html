<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">TASK 1</h1>
    <fieldset align="center">
        
       <form>
        <h1>Admin Login Page</h1>
        <br>

        <label for="username">Username:</label>
        <input type="text" name="username" id="Username:">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="Password" id="Password:">
        <br> <br>
        <button>Submit</button>
        <button>Reset</button>
       </form>

    </fieldset>

    <hr>
    <h1 align="center">TASK 2</h1>
    <fieldset>
        <h1> Pizza Order Form</h1>

        <table>
            <tr>
                <td><label for="firstname">Firstname:</label></td> 
                <td><input type="text" name="firstname" id="Firstname:"></td>
            </tr>
           

            <tr>
                <td><label for="lastname">Lastname:</label></td>
                <td><input type="text" name="lastname" id="Lastname:"></td>
            </tr>
           

            <tr>
                <td><label for="emailaddres">EmailAddres:</label></td>
                <td> <input type="email" name="emailaddres" id="EmailAddres:"></td>
            </tr>
            

            <tr>
                <td><label for="contactnumber">ContactNumber:</label></td>  
                <td> <input type="number" name="contactnumber" id="ContactNumber:"></td>
            </tr>

            <tr>
                <td><label for="preferred Delivery Date:">Preferred Delivery Date::</label></td>  
                <td> <input type="date" name="preferred Delivery Date:" id="Preferred Delivery Date:"></td>
            </tr>

            

        </table>
         <b><label for="size">Size</label></b>
        <br>
            <input type="radio" name="size" id="Size" value="size">
            <span>Small</span>
           
            
             <input type="radio" name="size" id="Size" value="size">
            <span>Medium</span>

             <input type="radio" name="size" id="Size" value="size">
            <span>Large</span>
            <br>
            
            <b>Flavor</b>
            <br>

            <input type="checkbox" name="size" id="Size" value="size">
            <span>Hawaiian (Php 150.00)</span>
             <select name="Quantity" id="Quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="5+">5+</option>
            </select>
            <br>

            
            <input type="checkbox" name="size" id="Size" value="size">
            <span>Pepperoni (Php 140.00)</span>
             <select name="Quantity" id="Quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="5+">5+</option>
            </select>
            <br>

            <input type="checkbox" name="size" id="Size" value="size">
            <span>Vegetable (Php 130.00)</span>
             <select name="Quantity" id="Quantity">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="5+">5+</option>
            </select>
            <br> <br>
          
            <table>
                <tr>
                    <td><label for="Credit Card Number">Credit Card Number:</label></td> 
                    <td> <input type="number" name="Credit Card Number:" id="Credit Card Number:"></td>
                </tr>

                <tr>
                    <td><label for="pin">PIN:</label></td> 
                     <td> <input type="pin" name="pin" id="PIN:"></td>
                </tr>
            </table>
             

             <br>

            <b> Additional Note</b>
            <label for="note"></label>
            <br>
            <textarea name="note" id="note"></textarea>
            <br>
            <button>Submit</button>
               
               
       


    </fieldset>


</body>
</html>
